name: Store CI

on:
  push:
    branches:
      - main
      - "s0/**"
      - "s1/**"
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Store
        uses: actions/checkout@v4

      - name: Checkout current 3mm contracts
        uses: actions/checkout@v4
        with:
          repository: ldobranov/3mm
          path: .core/3mm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install contract dependency
        run: |
          python -m pip install pydantic==2.13.4

      - name: Compile Python sources
        run: |
          python -m py_compile tools/*.py service/src/three_mm_store/*.py tests/*.py

      - name: Run Store tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build deterministic package
        run: |
          python tools/build_package.py --output dist/3mm-store.zip

      - name: Validate against current 3mm package contract
        run: |
          python tools/validate_against_3mm.py             --core-root .core/3mm             --package dist/3mm-store.zip
